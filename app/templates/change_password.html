{% extends "base.html" %}
{% set blank_layout = true %}

{% block content %}
<div class="login-page">
  <div class="login-container">
    <div class="login-brand">
      <i class="bi bi-shield-check"></i>
      <h1>安全设置</h1>
      <p>为了您的账号安全，首次登录请修改默认密码</p>
    </div>

    <div class="login-card">
      {% if err %}
        <div class="alert alert-danger py-2 small border-0 mb-4">
          <i class="bi bi-exclamation-circle me-2"></i>{{ err }}
        </div>
      {% endif %}

      <form method="post" action="/change-password" class="row g-4">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}" />
        <div class="col-12">
          <label class="form-label">新密码</label>
          <div class="input-group">
            <span class="input-group-text bg-transparent border-end-0">
              <i class="bi bi-lock"></i>
            </span>
            <input name="new_password" type="password" class="form-control border-start-0 ps-0" placeholder="请输入新密码" required minlength="5" />
          </div>
        </div>
        <div class="col-12">
          <label class="form-label">确认新密码</label>
          <div class="input-group">
            <span class="input-group-text bg-transparent border-end-0">
              <i class="bi bi-lock-fill"></i>
            </span>
            <input name="confirm_password" type="password" class="form-control border-start-0 ps-0" placeholder="请再次输入新密码" required minlength="5" />
          </div>
        </div>
        <div class="col-12 d-grid mt-4">
          <button class="btn btn-primary btn-login" type="submit">
            保存并进入系统
          </button>
        </div>
      </form>
    </div>
    
    <div class="text-center mt-5">
      <p class="text-secondary small">© 2026 网络设备备份系统</p>
    </div>
  </div>
</div>
{% endblock %}
